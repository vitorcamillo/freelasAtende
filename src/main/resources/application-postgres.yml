# Perfil opcional para persistencia local em Postgres.
# Use com: --spring.profiles.active=postgres
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freelas_atende}
    username: ${DB_USERNAME:freelas}
    password: ${DB_PASSWORD:freelas}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
