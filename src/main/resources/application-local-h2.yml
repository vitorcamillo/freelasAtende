# Perfil local duravel sem Postgres.
# Use com: --spring.profiles.active=local-h2
spring:
  datasource:
    url: ${H2_DB_URL:jdbc:h2:file:./data/freelas-atende;MODE=PostgreSQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${H2_DB_USERNAME:sa}
    password: ${H2_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

